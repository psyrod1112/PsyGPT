<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PsyGPT-mini</title>
<style>
  :root {
    --bg: #1a1915;
    --bg-panel: #211f1a;
    --border: #34322b;
    --text: #e8e4da;
    --text-dim: #948d7d;
    --accent: #c96442;
    --accent-dim: #7a3e2a;
    --bubble-user: #2b2924;
    --bubble-ai: #262420;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 10px;
  }
  header .logo {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); display: inline-block;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  header p { font-size: 12px; color: var(--text-dim); margin: 0; }

  main {
    flex: 1;
    overflow-y: auto;
    display: flex; justify-content: center;
  }
  #chat {
    width: 100%;
    max-width: 720px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .empty-hint {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    margin-top: 60px;
    line-height: 1.6;
  }

  .msg {
    padding: 14px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14.5px;
    white-space: pre-wrap;
    max-width: 92%;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border: 1px solid var(--border);
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border: 1px solid var(--border);
  }
  .msg .label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: block;
  }
  .msg.ai .label { color: var(--accent); }

  .thinking {
    align-self: flex-start;
    color: var(--text-dim);
    font-size: 13px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 16px 24px 22px;
    display: flex; justify-content: center;
  }
  #inputRow {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 8px 8px 16px;
  }
  #promptInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.5;
    padding: 8px 0;
    max-height: 140px;
  }
  #promptInput::placeholder { color: var(--text-dim); }
  #sendBtn {
    background: var(--accent);
    color: #1a1915;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-end;
    height: 38px;
  }
  #sendBtn:hover { background: #d97551; }
  #sendBtn:disabled { background: var(--accent-dim); cursor: not-allowed; }

  #meta {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 8px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <span class="logo"></span>
  <h1>PsyGPT-mini</h1>
  <p>&nbsp;&mdash;&nbsp;직접 학습시킨 BPE 언어모델</p>
</header>

<main>
  <div id="chat">
    <div class="empty-hint" id="emptyHint">
      프롬프트를 입력하면, 모델이 그 뒤를 이어서 씁니다.<br/>
      (질문에 답하는 챗봇이 아니라, 셰익스피어 텍스트로 학습된 순수 언어모델이에요)<br/>
      예: <em>"ROMEO:"</em>, <em>"To be or not"</em>
    </div>
  </div>
</main>

<div id="meta"></div>

<footer>
  <div id="inputRow">
    <textarea id="promptInput" rows="1" placeholder="여기에 프롬프트를 입력하세요..."></textarea>
    <button id="sendBtn">이어쓰기</button>
  </div>
</footer>

<script>
  const chat = document.getElementById("chat");
  const emptyHint = document.getElementById("emptyHint");
  const input = document.getElementById("promptInput");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(role, text) {
    if (emptyHint) emptyHint.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = role === "user" ? "prompt" : "model";
    div.appendChild(label);
    div.appendChild(document.createTextNode(text));
    chat.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  function addThinking() {
    const div = document.createElement("div");
    div.className = "thinking";
    div.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chat.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  async function send() {
    const prompt = input.value.trim();
    if (!prompt) return;

    addMessage("user", prompt);
    input.value = "";
    autoResize();
    sendBtn.disabled = true;
    input.disabled = true;

    const thinkingEl = addThinking();

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: prompt, max_new_tokens: 200 }),
      });
      const data = await res.json();
      thinkingEl.remove();
      addMessage("ai", data.text);
    } catch (err) {
      thinkingEl.remove();
      addMessage("ai", "[오류: 서버에 연결할 수 없어요 — server.py가 실행 중인지 확인하세요]");
    } finally {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("input", autoResize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
</script>

</body>
</html>
